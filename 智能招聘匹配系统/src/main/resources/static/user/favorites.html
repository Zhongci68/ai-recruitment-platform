<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>我的收藏</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<header class="topbar"></header>
<main class="layout">
    <div id="side"></div>
    <section class="content">
        <h2>我的收藏</h2>
        <table class="table"><thead>
        <tr><th>职位名称</th>
            <th>薪资范围</th>
            <th>岗位数量</th>
            <th>学历要求</th>
            <th>收藏时间</th>
            <th>详情</th>
            <th>操作</th>
        </tr>
        </thead>
            <tbody id="rows"></tbody>
        </table>
    </section>
</main>
<script src="/js/app-fixed.js"></script>
<script>
mountTopbar(); side.outerHTML = sidebar("user","favorites.html");
async function load(){ const data = await API.get("/api/user/favorites"); rows.innerHTML = data.map(f => `<tr><td>${f.job.title}</td><td>${money(f.job)}</td><td>${f.job.vacancyCount}</td><td>${f.job.education}</td><td>${fmtTime(f.createTime)}</td><td><a href="/detail.html?id=${f.job.id}">查看详情</a></td><td><button class="btn danger" onclick="cancel(${f.id})">取消收藏</button></td></tr>`).join(""); }
async function cancel(id){ await API.del("/api/user/favorites/" + id); load(); }
load();
</script>
</body>
</html>
