<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>我的投递</title><link rel="stylesheet" href="/css/app.css"></head>
<body><header class="topbar"></header><main class="layout"><div id="side"></div><section class="content"><h2>我的投递</h2><table class="table"><thead><tr><th>职位名称</th><th>薪资范围</th><th>投递时间</th><th>匹配度</th><th>状态</th><th>面试安排</th><th>详情</th></tr></thead><tbody id="rows"></tbody></table></section></main>
<script src="/js/app-fixed.js"></script><script>
mountTopbar(); side.outerHTML = sidebar("user","applications.html");
API.get("/api/user/applications").then(data => rows.innerHTML = data.map(row => {
  const a = row.record;
  const i = row.interview;
  const interview = i ? `<button class="btn secondary" onclick="alert('时间：${fmtTime(i.interviewTime)}\\n地点：${i.location || ''}\\n方式：${i.mode || ''}\\n备注：${i.remark || ''}')">查看面试安排</button>` : "暂无";
  return `<tr><td>${a.job.title}</td><td>${money(a.job)}</td><td>${fmtTime(a.applyTime)}</td><td>${a.matchScore}%</td><td>${a.status}</td><td>${interview}</td><td><a href="/detail.html?id=${a.job.id}">查看详情</a></td></tr>`;
}).join(""));
</script></body></html>
