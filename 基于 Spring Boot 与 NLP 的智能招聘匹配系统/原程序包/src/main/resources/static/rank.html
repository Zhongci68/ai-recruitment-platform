<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>浏览量排行</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<header class="topbar"></header>
<main class="container">
  <div class="section-title"><h2>浏览量排行 Top 10</h2><a href="/index.html">返回首页</a></div>
  <table class="table"><thead><tr>
    <th>排名</th>
    <th>职位</th>
    <th>薪资</th>
    <th>地区</th>
    <th>学历</th>
    <th>浏览量</th>
    <th>评分</th>
    <th>详情</th>
  </tr>
  </thead>
    <tbody id="rank"></tbody>
  </table>
</main>
<script src="/js/app-fixed.js"></script>
<script>
mountTopbar();
API.get("/api/public/rank").then(list => rank.innerHTML = list.map((j,i)=>`<tr><td>${i+1}</td><td>${j.title}</td><td>${money(j)}</td><td>${j.location||""}</td><td>${j.education||""}</td><td>${j.viewCount||0}</td><td>${j.ratingAverage||0}</td><td><a class="btn secondary" href="/detail.html?id=${j.id}">查看</a></td></tr>`).join(""));
</script>
</body>
</html>
