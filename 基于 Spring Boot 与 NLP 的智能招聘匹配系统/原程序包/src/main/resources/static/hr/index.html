<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>招聘者中心</title><link rel="stylesheet" href="/css/app.css"><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script></head>
<body>
<header class="topbar"></header>
<main class="layout">
    <div id="side"></div>
    <section class="content">
    <h2>招聘者数据看板</h2>
    <div id="stats" class="stats"></div>
        <div class="card">
    <div id="chart" class="chart">
    </div>
        </div>
    </section>
</main>
<script src="/js/app-fixed.js"></script>
<script>mountTopbar(); side.outerHTML = sidebar("hr","index.html"); API.get("/api/hr/dashboard").then(d => { stats.innerHTML = [["用户",d.userCount],["职位",d.jobCount],["投递",d.applicationCount],["收藏",d.favoriteCount]].map(s=>`<div class="card stat">${s[0]}<strong>${s[1]}</strong></div>`).join(""); echarts.init(chart).setOption({xAxis:{type:"category",data:d.skills},yAxis:{type:"value"},series:[{type:"bar",data:[18,16,13,11,9,8,7]}]}); });</script></body></html>
