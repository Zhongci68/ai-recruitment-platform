<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册登录</title><link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar"></header>
<main class="auth-box">
  <div class="tabs"><button class="btn" onclick="show('login')">登录</button><button class="btn secondary" onclick="show('register')">注册</button></div>
  <section id="login" class="card">
    <h2>用户登录</h2>
    <input id="loginAccount" placeholder="账号"><br><br>
    <input id="loginPassword" type="password" placeholder="密码"><br><br>
    <button class="btn" onclick="login()">登录</button>
    <p class="meta"></p>
  </section>
  <section id="register" class="card hidden">
    <h2>用户注册</h2>
    <input id="account" placeholder="用户名"><br><br>
    <input id="password" type="password" placeholder="密码"><br><br>
    <input id="confirmPassword" type="password" placeholder="再次输入密码"><br><br>
    <input id="phone" placeholder="手机号"><br><br>
    <select id="role"><option value="CANDIDATE">求职者</option><option value="RECRUITER">招聘者</option></select><br><br>
    <button class="btn" onclick="register()">注册</button>
  </section>
</main>
<script src="/js/api.js"></script>
<script>
mountTopbar();
function show(id){ document.getElementById("login").classList.toggle("hidden", id !== "login"); document.getElementById("register").classList.toggle("hidden", id !== "register"); }
async function login(){
  const data = await API.post("/api/auth/login", {account: loginAccount.value, password: loginPassword.value});
  localStorage.setItem("token", "Bearer " + data.token);
  localStorage.setItem("user", JSON.stringify(data.user));
  location.href = data.user.role === "ADMIN" ? "/admin/index.html" : data.user.role === "RECRUITER" ? "/hr/index.html" : "/index.html";
}
async function register(){
  await API.post("/api/auth/register", {account: account.value, password: password.value, confirmPassword: confirmPassword.value, phone: phone.value, role: role.value});
  alert("注册成功，请登录");
  show("login");
}

</script>
</body>
</html>
