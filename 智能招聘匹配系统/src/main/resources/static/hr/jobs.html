<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>岗位管理</title><link rel="stylesheet" href="/css/app.css"></head>
<body><header class="topbar"></header><main class="layout"><div id="side"></div><section class="content"><h2>岗位管理</h2><div class="card form-grid"><input id="title" placeholder="岗位名称"><input id="salaryRange" placeholder="薪资范围"><input id="location" placeholder="地区"><input id="education" placeholder="学历"><input id="vacancyCount" type="number" placeholder="岗位数量"><textarea id="description" placeholder="岗位介绍"></textarea><textarea id="requirementsText" placeholder="任职要求"></textarea><button class="btn" onclick="save()">发布岗位</button></div><h3>已发布岗位</h3><div id="list" class="grid"></div></section></main>
<script src="/js/app-fixed.js"></script><script>mountTopbar(); side.outerHTML = sidebar("hr","jobs.html"); async function load(){ const data=await API.get("/api/hr/jobs"); list.innerHTML=data.map(j=>jobCard(j)).join(""); } async function save(){ await API.post("/api/hr/jobs", {title:title.value,salaryRange:salaryRange.value,location:location.value,education:education.value,vacancyCount:Number(vacancyCount.value||1),description:description.value,requirementsText:requirementsText.value}); load(); } load();</script></body></html>
