<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>我的简历</title><link rel="stylesheet" href="/css/app.css"></head>
<body><header class="topbar"></header><main class="layout"><div id="side"></div><section class="content"><h2>简历编辑</h2><div class="step-layout"><div class="steps"><button class="active">基本信息</button><button>教育经历</button><button>工作经历</button><button>项目经历</button><button>技能特长</button></div><div class="card form-grid"><input id="eduLevel" placeholder="最高学历"><input id="experienceYears" type="number" placeholder="工作/项目年限"><textarea id="educationExperience" placeholder="教育经历"></textarea><textarea id="workExperience" placeholder="工作经历"></textarea><textarea id="projectExperience" placeholder="项目经历"></textarea><textarea id="skills" placeholder="技能特长，如 Java, Spring Boot, MySQL"></textarea><textarea id="rawText" placeholder="简历原文，可粘贴 PDF/Word 提取后的文本，系统会自动结构化"></textarea><button class="btn" onclick="save()">保存简历</button></div></div></section></main>
<script src="/js/app-fixed.js"></script><script>mountTopbar(); side.outerHTML = sidebar("user","resume.html"); API.get("/api/user/resume").then(r => ["eduLevel","experienceYears","educationExperience","workExperience","projectExperience","skills","rawText"].forEach(k => document.getElementById(k).value = r[k] || "")); async function save(){ await API.post("/api/user/resume", {eduLevel:eduLevel.value, experienceYears:Number(experienceYears.value||0), educationExperience:educationExperience.value, workExperience:workExperience.value, projectExperience:projectExperience.value, skills:skills.value, rawText:rawText.value}); alert("简历已保存，并完成关键词解析"); }</script></body></html>
